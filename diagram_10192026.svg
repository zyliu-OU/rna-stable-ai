<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 830" width="1420" height="830" font-family="Helvetica, Arial, sans-serif">
  <title>RNA-StableAI four-component workflow and its implementation state on 2026-10-19</title>
  <desc>RNAfold supplies ensemble folding features. Published STRAND can only be replayed on released LinearPartition features; substituting RNAfold features into it was rejected because the ALO feature is not reproducible across engines. A separately named refit, strand_rnafold_calibration_v1, consumes RNAfold ensemble features instead. RiboNN scores released translational-efficiency tasks from sequence plus numeric UTR and CDS sizes, but no task has been selected and no released task is cell-free. Both sides feed versioned score records that bind identities, units, exclusions and raw artifact paths; a composite score is blocked because the units are incommensurable, no floor is selected, and no sequence carries both a stability and a translation score. BoTorch discrete Bayesian optimization and the cell-free expression assay sit behind the open Stage 2 to Stage 3 gate.</desc>
  <rect x="0" y="0" width="1420" height="830" fill="#ffffff"/>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#1f2328">RNA-StableAI — four-component workflow and what is actually wired</text>
  <text x="40" y="62" font-size="13" fill="#57606a">RNAfold + STRAND + RiboNN + BoTorch. Every component runs; the joins between them are where the work stands or stops.</text>

  <!-- Stage 2 gate -->
  <text x="1150" y="80" font-size="12.5" font-weight="bold" fill="#cf222e" text-anchor="middle">Stage 2 → Stage 3 gate</text>
  <text x="1150" y="97" font-size="11" fill="#cf222e" text-anchor="middle">OPEN — 0 of 6 requirements satisfied</text>
  <line x1="1150" y1="108" x2="1150" y2="700" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- A1 transcript -->
  <rect x="40" y="360" width="170" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="392" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Transcript sequence</text>
  <text x="125" y="412" font-size="11" fill="#57606a" text-anchor="middle">1–2,999 nt active scope</text>
  <text x="125" y="430" font-size="11" fill="#57606a" text-anchor="middle">ACGU, no truncation</text>

  <!-- B1 released tables -->
  <rect x="260" y="120" width="200" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="360" y="152" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Released STRAND tables</text>
  <text x="360" y="172" font-size="11" fill="#57606a" text-anchor="middle">LinearPartition features</text>
  <text x="360" y="190" font-size="11" fill="#57606a" text-anchor="middle">69 nLuc + 22 validation</text>

  <!-- B2 RNAfold -->
  <rect x="260" y="360" width="200" height="110" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="360" y="390" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">RNAfold — ViennaRNA 2.7.2</text>
  <text x="360" y="410" font-size="11" fill="#57606a" text-anchor="middle">Turner 2004 · 37 °C · dangles 2</text>
  <text x="360" y="428" font-size="11" fill="#57606a" text-anchor="middle">MFE + partition function</text>
  <text x="360" y="446" font-size="11" fill="#57606a" text-anchor="middle">isolated worker per sequence</text>
  <text x="360" y="492" font-size="11" fill="#0969da" text-anchor="middle">ensemble ΔG/nt · GC% · AUP · ALO</text>

  <!-- C1 published STRAND -->
  <rect x="560" y="120" width="230" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="675" y="152" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Published STRAND</text>
  <text x="675" y="172" font-size="11" fill="#57606a" text-anchor="middle">reference-only replay</text>
  <text x="675" y="190" font-size="11" fill="#57606a" text-anchor="middle">unchanged published coefficients</text>

  <!-- C2 calibration -->
  <rect x="560" y="270" width="230" height="96" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="675" y="300" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="middle">strand_rnafold_calibration_v1</text>
  <text x="675" y="320" font-size="11" fill="#57606a" text-anchor="middle">PLS refit · without-ALO · 1 component</text>
  <text x="675" y="338" font-size="11" fill="#cf222e" text-anchor="middle">not published STRAND · not validated</text>

  <!-- C3 RiboNN -->
  <rect x="560" y="560" width="230" height="110" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="675" y="592" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">RiboNN</text>
  <text x="675" y="612" font-size="11" fill="#57606a" text-anchor="middle">50 released human checkpoints</text>
  <text x="675" y="630" font-size="11" fill="#57606a" text-anchor="middle">78 released TE tasks</text>
  <text x="675" y="648" font-size="11" fill="#57606a" text-anchor="middle">mean over per-fold predictions</text>

  <!-- D1 score records -->
  <rect x="880" y="300" width="210" height="200" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="985" y="334" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Score records v1</text>
  <text x="985" y="353" font-size="11" fill="#57606a" text-anchor="middle">provenance binding</text>
  <text x="985" y="382" font-size="11" fill="#1f2328" text-anchor="middle">sequence · annotation</text>
  <text x="985" y="402" font-size="11" fill="#1f2328" text-anchor="middle">tool · model · weight identity</text>
  <text x="985" y="422" font-size="11" fill="#1f2328" text-anchor="middle">units / target scale</text>
  <text x="985" y="442" font-size="11" fill="#1f2328" text-anchor="middle">exclusion reason</text>
  <text x="985" y="462" font-size="11" fill="#1f2328" text-anchor="middle">raw artifact paths</text>
  <text x="985" y="486" font-size="11" fill="#57606a" text-anchor="middle">99 records built</text>

  <!-- E gated -->
  <rect x="1180" y="260" width="200" height="96" rx="6" fill="#f0f1f3" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1280" y="298" font-size="13" font-weight="bold" fill="#57606a" text-anchor="middle">BoTorch discrete BO</text>
  <text x="1280" y="318" font-size="11" fill="#8c959f" text-anchor="middle">software mechanics only</text>
  <text x="1280" y="336" font-size="11" fill="#8c959f" text-anchor="middle">31-point toy pool</text>

  <rect x="1180" y="430" width="200" height="96" rx="6" fill="#f0f1f3" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1280" y="468" font-size="13" font-weight="bold" fill="#57606a" text-anchor="middle">Cell-free expression</text>
  <text x="1280" y="488" font-size="11" fill="#8c959f" text-anchor="middle">Stage 3 target</text>
  <text x="1280" y="506" font-size="11" fill="#8c959f" text-anchor="middle">queued · assay not defined</text>

  <!-- edges -->
  <line x1="210" y1="408" x2="252" y2="408" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="231" y="399" font-size="10.5" fill="#57606a" text-anchor="middle">folds</text>

  <line x1="460" y1="168" x2="552" y2="168" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="506" y="158" font-size="10.5" fill="#57606a" text-anchor="middle">replay only</text>

  <polyline points="460,390 505,390 505,318 552,318" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="468" y="384" font-size="10.5" fill="#0969da">refit on ensemble features</text>

  <!-- rejected substitution -->
  <polyline points="360,360 360,256 660,256 660,222" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <text x="374" y="228" font-size="11" font-weight="bold" fill="#cf222e">RNAfold features into the published model</text>
  <text x="374" y="244" font-size="11" fill="#cf222e">rejected — ALO not reproducible across engines</text>

  <polyline points="125,456 125,615 552,615" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="162" y="606" font-size="10.5" fill="#57606a">sequence + numeric UTR5 / CDS sizes</text>

  <line x1="790" y1="176" x2="872" y2="326" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="800" y="200" font-size="10.5" fill="#57606a">hours — released half-life scale</text>

  <line x1="790" y1="322" x2="872" y2="372" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="806" y="348" font-size="10.5" fill="#57606a">hours</text>

  <line x1="790" y1="608" x2="872" y2="474" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="798" y="556" font-size="10.5" fill="#57606a">released TE task scale</text>
  <text x="798" y="571" font-size="10.5" fill="#57606a">no physical unit</text>

  <line x1="1090" y1="400" x2="1142" y2="400" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="1158" y1="392" x2="1172" y2="320" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGrey)"/>
  <line x1="1158" y1="410" x2="1172" y2="466" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGrey)"/>

  <!-- blockers -->
  <text x="560" y="690" font-size="11" fill="#cf222e">task not selected — none of the 78 released tasks is cell-free</text>
  <text x="560" y="706" font-size="11" fill="#cf222e">released STRAND references carry UTR/CDS descriptions only, no numeric boundaries</text>

  <text x="880" y="524" font-size="11.5" font-weight="bold" fill="#cf222e">composite score: blocked</text>
  <text x="880" y="541" font-size="11" fill="#cf222e">incommensurable units · no floor selected</text>
  <text x="880" y="557" font-size="11" fill="#cf222e">0 of 99 records carry both sides</text>

  <!-- legend -->
  <line x1="40" y1="748" x2="76" y2="748" stroke="#0969da" stroke-width="1.8"/>
  <text x="84" y="752" font-size="11" fill="#57606a">implemented and replayed</text>
  <line x1="40" y1="770" x2="76" y2="770" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="84" y="774" font-size="11" fill="#57606a">rejected or blocked</text>
  <line x1="40" y1="792" x2="76" y2="792" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="84" y="796" font-size="11" fill="#57606a">behind the open gate</text>

  <text x="1380" y="752" font-size="11" fill="#57606a" text-anchor="end">2,000–2,999 nt band: blocked on acquisition — 56 eligible records, 1 clan, 0 new clans</text>
  <text x="1380" y="772" font-size="11" fill="#57606a" text-anchor="end">no stability or expression benefit is established by any path shown here</text>
  <text x="1380" y="796" font-size="11" fill="#8c959f" text-anchor="end">state as of 2026-10-19 · handoffs V1–V4</text>
</svg>
