<svg xmlns="http://www.w3.org/2000/svg" width="760" height="812" viewBox="0 0 760 812" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>RNA-StableAI design workflow as built on 2026-10-20, and where it stops</title>
<desc>The reference construct feeds a windowed synonymous design space, whose members are assembled through a variant path that hash-verifies the reference and verifies the protein, folded by ViennaRNA, then scored on two incommensurable sides: a STRAND calibration refit predicting in-solution half-life in hours, and a released RiboNN task predicting translational efficiency. The two sides converge on a Pareto front that emits no composite score, and BoTorch selects a panel by maximising dominated hypervolume. Every stage shown in green has run and replayed. The transfected-cell assay is red and unreached because no experimental measurement of any construct exists. Gate v6 records Stage 2 satisfied six of six, two of them by accepted limitation, and opens new-sequence scoring and candidate design while leaving expression benefit unestablished. The learned pair model is retired and the window-width axis is closed at a measured 8.4 percent of the calibration training range.</desc>
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="760" height="812" fill="#ffffff"/>

<!-- flow: reference construct -->
<rect x="36" y="56" width="372" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Reference construct, 1811 nt</text>
<text x="222" y="98" text-anchor="middle" font-size="10.5" fill="#085041">5&#8242;UTR 44 + Fluc ORF 1653 + 3&#8242;UTR 114, hash-verified</text>
<text x="222" y="112" text-anchor="middle" font-size="10.5" fill="#085041">poly(A) recorded, deliberately not appended</text>
<line x1="222" y1="118" x2="222" y2="146" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- flow: design space -->
<rect x="36" y="148" width="372" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222" y="170" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Design space v2: synonymous codons 1&#8211;50</text>
<text x="222" y="190" text-anchor="middle" font-size="10.5" fill="#085041">512-member GC-neutral pool, window GC held constant</text>
<text x="222" y="204" text-anchor="middle" font-size="10.5" fill="#085041">edit distance sampled uniformly, 0&#8211;24 substitutions</text>
<line x1="222" y1="210" x2="222" y2="238" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- flow: variant assembly -->
<rect x="36" y="240" width="372" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222" y="262" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">assemble_variant</text>
<text x="222" y="282" text-anchor="middle" font-size="10.5" fill="#085041">reference still hash-gated; protein identity verified per member</text>
<line x1="222" y1="296" x2="222" y2="324" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- flow: folding -->
<rect x="36" y="326" width="372" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222" y="348" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">ViennaRNA 2.7.2 ensemble fold</text>
<text x="222" y="368" text-anchor="middle" font-size="10.5" fill="#085041">512/512 folds succeeded; LinearFold is the second native control</text>
<line x1="150" y1="382" x2="128" y2="408" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="294" y1="382" x2="316" y2="408" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- flow: two score sides -->
<rect x="36" y="410" width="178" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="430" text-anchor="middle" font-size="12.5" font-weight="500" fill="#085041">STRAND calibration v1</text>
<text x="125" y="448" text-anchor="middle" font-size="10.5" fill="#085041">predicted in-solution</text>
<text x="125" y="462" text-anchor="middle" font-size="10.5" fill="#085041">half-life, hours</text>
<text x="125" y="478" text-anchor="middle" font-size="10" fill="#791F1F">unvalidated; extrapolates on GC</text>

<rect x="230" y="410" width="178" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="319" y="430" text-anchor="middle" font-size="12.5" font-weight="500" fill="#085041">RiboNN, 50 checkpoints</text>
<text x="319" y="448" text-anchor="middle" font-size="10.5" fill="#085041">predicted_TE_A549,</text>
<text x="319" y="462" text-anchor="middle" font-size="10.5" fill="#085041">released task scale</text>
<text x="319" y="478" text-anchor="middle" font-size="10" fill="#791F1F">A549 only; T cells model-blind</text>

<line x1="128" y1="486" x2="150" y2="512" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="316" y1="486" x2="294" y2="512" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- flow: pareto -->
<rect x="36" y="514" width="372" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222" y="536" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Pareto front over both sides</text>
<text x="222" y="556" text-anchor="middle" font-size="10.5" fill="#085041">dominance is coordinate-wise, so no weighting and no shared unit</text>
<line x1="222" y1="570" x2="222" y2="598" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- flow: botorch panel -->
<rect x="36" y="600" width="372" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222" y="622" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">BoTorch panel selection</text>
<text x="222" y="642" text-anchor="middle" font-size="10.5" fill="#085041">hypervolume-maximising subset; qLogNEHVI beat random at budget 32</text>
<line x1="222" y1="656" x2="222" y2="684" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>

<!-- flow: assay, unreached -->
<rect x="36" y="686" width="372" height="62" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="222" y="708" text-anchor="middle" font-size="14" font-weight="500" fill="#791F1F">Transfected-cell assay, unreached</text>
<text x="222" y="728" text-anchor="middle" font-size="10.5" fill="#791F1F">A549 and activated CD3+ T cells; luminescence and RT-qPCR</text>
<text x="222" y="742" text-anchor="middle" font-size="10.5" fill="#791F1F">no measurement of any construct exists</text>

<!-- annotations -->
<rect x="440" y="56" width="284" height="90" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="582" y="76" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0C447C">Gate v6, 2026-10-20</text>
<text x="582" y="94" text-anchor="middle" font-size="10.5" fill="#0C447C">Stage 2 satisfied 6 of 6, two of them</text>
<text x="582" y="108" text-anchor="middle" font-size="10.5" fill="#0C447C">by accepted limitation, not by evidence</text>
<text x="582" y="124" text-anchor="middle" font-size="10.5" fill="#0C447C">new-sequence scoring and candidate</text>
<text x="582" y="138" text-anchor="middle" font-size="10.5" fill="#0C447C">design open; benefit NOT established</text>

<rect x="440" y="160" width="284" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="582" y="180" text-anchor="middle" font-size="12.5" font-weight="500" fill="#444441">Window axis closed</text>
<text x="582" y="198" text-anchor="middle" font-size="10.5" fill="#444441">spread &#8733; window^0.42 over 18-fold width</text>
<text x="582" y="212" text-anchor="middle" font-size="10.5" fill="#444441">at the ceiling, 90.9% of the transcript,</text>
<text x="582" y="226" text-anchor="middle" font-size="10.5" fill="#444441">half-life spans 8.4% of training range</text>

<rect x="440" y="250" width="284" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="582" y="270" text-anchor="middle" font-size="12.5" font-weight="500" fill="#444441">Learned pair model retired</text>
<text x="582" y="288" text-anchor="middle" font-size="10.5" fill="#444441">0.2965 against 0.4381 pair F1; structure</text>
<text x="582" y="302" text-anchor="middle" font-size="10.5" fill="#444441">now comes from ViennaRNA / LinearFold</text>

<rect x="440" y="326" width="284" height="62" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="582" y="346" text-anchor="middle" font-size="12.5" font-weight="500" fill="#791F1F">Rejected</text>
<text x="582" y="364" text-anchor="middle" font-size="10.5" fill="#791F1F">published STRAND coefficients on</text>
<text x="582" y="378" text-anchor="middle" font-size="10.5" fill="#791F1F">RNAfold-derived features</text>
<line x1="440" y1="357" x2="420" y2="357" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="357" x2="420" y2="440" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="440" x2="216" y2="440" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>

<rect x="440" y="402" width="284" height="62" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="582" y="422" text-anchor="middle" font-size="12.5" font-weight="500" fill="#791F1F">Composite score blocked</text>
<text x="582" y="440" text-anchor="middle" font-size="10.5" fill="#791F1F">hours against a unitless task scale;</text>
<text x="582" y="454" text-anchor="middle" font-size="10.5" fill="#791F1F">no weighting justified, no floor selected</text>

<rect x="440" y="478" width="284" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="582" y="498" text-anchor="middle" font-size="12.5" font-weight="500" fill="#444441">Unresolved, carried</text>
<text x="582" y="516" text-anchor="middle" font-size="10.5" fill="#444441">base-pair span policy; blinded 85-record</text>
<text x="582" y="530" text-anchor="middle" font-size="10.5" fill="#444441">set unspent; m1&#936; unrepresented by</text>
<text x="582" y="544" text-anchor="middle" font-size="10.5" fill="#444441">every component in the stack</text>

<rect x="440" y="568" width="284" height="90" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="582" y="588" text-anchor="middle" font-size="12.5" font-weight="500" fill="#791F1F">Blocking the assay</text>
<text x="582" y="606" text-anchor="middle" font-size="10.5" fill="#791F1F">measured CVs for both readouts;</text>
<text x="582" y="620" text-anchor="middle" font-size="10.5" fill="#791F1F">panel capacity; cost of a false accept</text>
<text x="582" y="634" text-anchor="middle" font-size="10.5" fill="#791F1F">against a false reject; whether</text>
<text x="582" y="648" text-anchor="middle" font-size="10.5" fill="#791F1F">Fluc-PEST enters the panel</text>
<line x1="440" y1="613" x2="418" y2="613" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="418" y1="613" x2="418" y2="717" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="418" y1="717" x2="410" y2="717" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- legend -->
<rect x="440" y="686" width="284" height="62" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
<rect x="454" y="700" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="474" y="710" font-size="10.5" fill="#444441">runs and is replayed</text>
<rect x="454" y="718" width="12" height="12" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="474" y="728" font-size="10.5" fill="#444441">rejected, blocked or unreached</text>
<rect x="602" y="700" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="622" y="710" font-size="10.5" fill="#444441">recorded state</text>
<rect x="602" y="718" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="622" y="728" font-size="10.5" fill="#444441">gate decision</text>

<text x="380" y="780" text-anchor="middle" font-size="10.5" fill="#5F5E5A">Implementation state on 2026-10-20. Every value produced by the green path is a prediction from an unvalidated model</text>
<text x="380" y="796" text-anchor="middle" font-size="10.5" fill="#5F5E5A">on a quantity the assay does not measure. No stability, translation or expression benefit is established by any path shown.</text>
</svg>
