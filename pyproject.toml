[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RNA-StableAI"
version = "0.1.0"
description = "Reproducible long-RNA CPU folding and separate encoder benchmarks"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas", "biopython", "psutil", "tqdm", "pyyaml", "matplotlib", "torch", "ViennaRNA"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rnastable = "rnastable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
